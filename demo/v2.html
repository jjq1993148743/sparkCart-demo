function burst(seed,hue,n){
 let s=seed,lines='',dots='';
 const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
 for(let i=0;i<(n||24);i++){
  const a=Math.PI*2*i/(n||24),len=25+rnd()*17;
  const x1=50+Math.cos(a)*7,y1=50+Math.sin(a)*7;
  const x2=50+Math.cos(a)*len,y2=50+Math.sin(a)*len;
  lines+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="hsl(${hue},64%,74%)" stroke-width=".7" opacity="${(.3+rnd()*.6).toFixed(2)}"/>`;
  if(rnd()>.42)dots+=`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="${(.7+rnd()*.9).toFixed(1)}" fill="hsl(${hue},80%,80%)" opacity=".9"/>`;
 }
 return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="50" cy="50" r="3.6" fill="hsl(${hue},72%,82%)"/><circle cx="50" cy="50" r="11" fill="none" stroke="hsl(${hue},60%,72%)" stroke-width=".5" opacity=".45"/>${lines}${dots}</svg>`;
}
function qr(seed){let s=seed,c='';const r=()=>{s=(s*9301+49297)%233280;return s/233280};for(let y=0;y<21;y++)for(let x=0;x<21;x++){const k=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on;if(k){const a=x>13?x-14:x,b=y>13?y-14:y;on=(a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4))}else on=r()>.52;if(on)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${c}</svg>`}
function thumb(p){return `<div class="thumb" style="--glow:hsl(${p.hue},48%,25%)">${burst(Number(p.code)*7,p.hue,26)}<span class="code">No. ${p.code}</span></div>`}
function pcard(p){const off=p.on===0;return `<div class="card flat hover" data-act="product" data-id="${p.id}">${thumb(p)}<div class="pname">${p.name}</div><div class="pcode">${p.spec}</div><div class="row between" style="margin-top:9px"><span class="tag ${off?'s4':''}">${off?'已下架':'可加购'}</span><button class="btn mini ${off?'ghost':''}" data-act="add" data-id="${p.id}" ${off?'disabled':''}>加入</button></div></div>`}
function cartItem(c){
 if(c.type==='package'){const k=S.packages.find(x=>x.id===c.id);return k?{name:k.name,code:'套餐',hue:k.hue,price:k.price,seed:Number(c.id.slice(1))*311,spec:'套餐组合'}:null}
 const x=S.products.find(y=>y.id===c.id);return x?{name:x.name,code:x.code,hue:x.hue,price:x.price,seed:Number(x.code)*7,spec:x.spec}:null
}
function pkgNames(k){return k.contains.map(id=>{const p=S.products.find(x=>x.id===id);return p?p.name:''}).filter(Boolean)}
function savePackage(d){
 const contains=Array.isArray(d.contains)?d.contains.filter(id=>S.products.some(p=>p.id===id)):[];
 const data={name:String(d.name||'').trim()||'未命名套餐',desc:String(d.desc||'').trim(),price:Number(d.price)||0,contains};

 if(S.adminTab==='packages')body=`<button class="btn" data-act="new-package" style="margin-bottom:12px">＋ 新增套餐</button>`+S.packages.map(k=>`<div class="card hover" data-act="package" data-id="${k.id}"><div class="row"><div class="vburst">${burst(k.name.length*137,k.hue,18)}</div><div style="flex:1;min-width:0;margin-left:11px"><div class="vtitle">${esc(k.name)}</div><div class="muted">${esc(k.desc||pkgNames(k).join(' · '))}</div><div class="sub" style="margin-top:4px">包含 ${k.contains.length} 项：${esc(pkgNames(k).join('、'))||'尚未选择产品'} · 登记价 ${money(k.price)}</div></div><span class="tag ${k.on?'s2':'s4'}">${k.on?'已上架':'已下架'}</span></div><div class="row" style="margin-top:11px;gap:7px"><button class="btn mini ghost" data-act="edit-package" data-id="${k.id}">编辑内容</button><button class="btn mini ghost" data-act="toggle-package" data-id="${k.id}">${k.on?'下架':'上架'}</button><span style="flex:1"></span><span class="muted" style="font-size:9.5px">查看 ›</span></div></div>`).join('')+note_('新增、编辑、上下架、删除都在这里；下架后客户端不再展示。客户端只看到套餐内容，不显示价格。');
 if(S.adminTab==='customers'){const cs=[...new Map(all.map(o=>[o.tel,o])).values()];body=`<div class="sec"><h3>客户档案</h3><small>${cs.length} 位</small></div>`+cs.map(o=>`<div class="item"><div class="row between"><span class="ttl">${esc(o.who)}</span><span class="tag">${all.filter(x=>x.tel===o.tel).length} 单</span></div><div class="sub">${o.tel}<br>最近备注：${esc(o.note)}</div></div>`).join('')+note_('不强制授权才能浏览；定位第一版不做。')}
 if(S.adminTab==='logs')body=`<div class="sec"><h3>操作记录</h3></div>`+S.logs.map(n=>`<div class="item"><div class="row between"><span class="ttl">${n.e}</span><span class="tag">${n.t}</span></div><div class="sub">对象：${n.to}<br>方式：后台站内留痕 · 线下微信 / 电话沟通</div></div>`).join('')+note_('按无认证服务号处理：不做公众号模板消息；商户登录后台查看新订单。一次性订阅消息留作二期可选。');
 return `<div class="stabs">${tabs.map(t=>`<div class="stab ${S.adminTab===t[0]?'on':''}" data-act="admin-tab" data-tab="${t[0]}">${t[1]}</div>`).join('')}</div>${body}`;
}
function renderModal(){
 const host=document.getElementById('modalHost'),m=S.modal;
 if(!m){host.innerHTML='';return}
 let b='';
 if(m.type==='product'){const x=S.products.find(p=>p.id===m.id);
  b=`<h3>${x.name}<span class="close" data-act="close">关闭</span></h3>${thumb(x)}<div class="muted" style="margin:11px 0">编号 ${x.code} · ${x.spec}</div>
   <div class="card hover" data-act="video"><div class="row"><div class="vplay"><svg viewBox="0 0 20 20"><path d="M7 4.2l8.5 5.8L7 15.8z"/></svg></div><div style="margin-left:11px"><div class="vtitle">观看烟花效果</div><div class="muted">商户实拍 · 云存储播放</div></div></div></div>
   <div class="card"><div class="vtitle" style="margin-bottom:10px">选择规格（三层库存独立）</div>${['单品','单组','单件'].map((s,i)=>`<div class="row between" style="margin-bottom:8px"><span style="font-size:11px">${s}　<span class="muted">库存 ${x.stk[i]}</span></span><button class="btn mini ${x.stk[i]===0?'ghost':''}" data-act="add" data-id="${x.id}" data-spec="${s}" ${x.stk[i]===0?'disabled':''}>加入</button></div>`).join('')}</div>
   ${note_('客户端不显示价格。图片与视频由商户提供，字段可不填也能上架。')}`}
 if(m.type==='order'){const o=S.orders.find(x=>x.no===m.no);
  b=`<h3>订单详情<span class="close" data-act="close">关闭</span></h3><div class="item"><div class="row between"><span class="ttl">${esc(o.who)}</span>${stTag(o.status)}</div><div class="sub">${o.no}<br>${o.date}<br>${o.tel}<br>备注：${esc(o.note)||'无'}</div></div>
   <div class="card">${o.items.map(i=>`<div class="row between" style="margin-bottom:7px"><span style="font-size:11.5px">${i.name}（${i.spec}）× ${i.qty}</span>${S.role==='customer'?'':`<span class="muted" style="font-family:var(--num)">${money(i.price*i.qty)}</span>`}</div>`).join('')}${S.role==='customer'?'':`<div class="row between" style="border-top:1px solid var(--line);padding-top:9px;margin-top:3px"><b style="font-size:11.5px">合计（后台）</b><b class="gold" style="font-family:var(--num);font-size:14px;font-weight:400">${money(amt(o))}</b></div>`}</div>
   <div class="sec" style="margin:14px 0 7px"><h3>状态流转</h3></div><div class="timeline"><div>${o.date}　订单已提交</div>${o.status!=='已提交'?`<div>商户已确定，开始备货</div>`:''}${o.status==='已完成'?`<div>订单已完成</div>`:''}${o.status==='已取消'?`<div>订单已取消</div>`:''}</div>
   ${note_('只登记订单，不支付、不结算。')}`}
 if(m.type==='package'){const k=S.packages.find(x=>x.id===m.id)||S.packages[0];
  b=`<h3>${esc(k.name)}<span class="close" data-act="close">关闭</span></h3><div class="card" style="text-align:center;padding:14px"><div style="width:138px;height:138px;margin:0 auto">${burst(k.name.length*137,k.hue,28)}</div><div class="muted" style="margin-top:8px">${esc(k.desc||pkgNames(k).join(' · '))}</div></div>
   <div class="sec" style="margin:15px 0 8px"><h3>包含产品</h3><small>${k.contains.length} 项</small></div><div class="card">${k.contains.map(cid=>{const p=S.products.find(x=>x.id===cid);return p?`<div class="row between" style="margin-bottom:8px"><span style="font-size:11.5px">${p.name}</span><span class="pcode">No. ${p.code}</span></div>`:''}).join('')||'<div class="muted">尚未选择产品</div>'}</div>
   ${S.role==='customer'?`<button class="btn" data-act="add-package" data-id="${k.id}">把套餐加入选品单</button>`:`<button class="btn ghost" data-act="close">返回</button>`}${note_('客户端不显示价格；提交订单后由商户线下核对货品与沟通。')}`}
 if(m.type==='pkgEdit'){
  const k=m.id?S.packages.find(x=>x.id===m.id):null,key=m.id||'new';
  if(!S._pkgDraft||S._pkgDraft._for!==key)S._pkgDraft={_for:key,id:m.id||null,name:k?k.name:'',desc:k?k.desc:'',price:k?k.price:'',contains:k?[...k.contains]:[]};
  const d=S._pkgDraft;
  b=`<h3>${k?'编辑套餐':'新增套餐'}<span class="close" data-act="close">关闭</span></h3><div class="card"><label class="f">套餐名称</label><input class="f" data-field="pkgName" value="${esc(d.name)}" placeholder="例如：开业大吉套餐"><label class="f">展示说明（可不填，默认列出所选产品）</label><input class="f" data-field="pkgDesc" value="${esc(d.desc)}" placeholder="客户端展示的一句话说明"><label class="f">登记价（仅后台可见）</label><input class="f" type="number" data-field="pkgPrice" value="${d.price}" placeholder="0"></div>
   <div class="sec" style="margin:15px 0 8px"><h3>从产品库选择</h3><small>已选 <b class="gold">${d.contains.length}</b> 项</small></div>
   <div class="card" style="max-height:216px;overflow-y:auto">${S.products.map(p=>`<div class="pick ${d.contains.includes(p.id)?'on':''}" data-act="pick-product" data-id="${p.id}"><div class="box">${d.contains.includes(p.id)?'✓':''}</div><div class="mini-thumb" style="background:radial-gradient(circle,hsl(${p.hue},48%,25%),#0A1222)">${burst(Number(p.code)*7,p.hue,14)}</div><div class="pn">${p.name}</div><span class="pc">No. ${p.code}</span></div>`).join('')}</div>
   <button class="btn" style="margin-top:12px" data-act="save-package">保存套餐</button>${k?`<button class="btn ghost" style="margin-top:9px" data-act="delete-package" data-id="${k.id}">删除这个套餐</button>`:''}${note_('先填套餐信息，再从产品库勾选产品；不勾也能保存。客户端只展示内容不显示价格。')}`}
 if(m.type==='video')b=`<h3>烟花效果视频<span class="close" data-act="close">关闭</span></h3><div class="card" style="text-align:center;padding:22px 14px"><div style="width:170px;height:170px;margin:0 auto">${burst(2026,40,32)}</div><div class="muted" style="margin-top:12px">演示占位：正式版播放商户提供的实拍视频，文件放云存储</div></div><button class="btn ghost" data-act="close">知道了</button>`;
 host.innerHTML=`<div class="mbg" data-act="close-bg"><div class="modal">${b}</div></div>`;
}
function render(){
 const r=S.role,c=TABS[r];
 document.getElementById('rTitle').textContent=ROLE[r][0];
 document.getElementById('rSub').textContent=ROLE[r][1];
 document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.role===r));
 document.getElementById('tabbar').innerHTML=c.map(t=>`<button data-act="nav" data-page="${t.k}" class="${S.page===t.k||(r==='customer'&&S.page==='checkout'&&t.k==='cart')?'on':''}">${icon(t.i)}${t.n}</button>`).join('');
 const key=r+'/'+S.page,keep=S._key===key,s=document.getElementById('screen'),y=s.scrollTop;
 s.innerHTML=({customer:renderCustomer,merchant:renderMerchant})[r]();
 s.scrollTop=keep?y:0;S._key=key;renderModal();
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,no=el.dataset.no;
 if(a==='close-bg'&&e.target!==el)return;
 if(a==='role'){S.role=el.dataset.role;S.page=TABS[S.role][0].k;S.modal=null;render();return}
 if(a==='nav'){S.page=el.dataset.page;S.modal=null;render();return}
 if(a==='cat'){S.cat=el.dataset.cat;S.page=S.role==='customer'?'goods':S.page;render();return}
 if(a==='product'){S.modal={type:'product',id};renderModal();return}
 if(a==='package'){S.modal={type:'package',id};renderModal();return}
 if(a==='order'){S.modal={type:'order',no};renderModal();return}
 if(a==='video'){S.modal={type:'video'};renderModal();return}
 if(a==='close'||a==='close-bg'){S.modal=null;renderModal();return}
 if(a==='add'){const spec=el.dataset.spec||'单件',c=S.cart.find(x=>x.id===id&&x.spec===spec);if(c)c.qty++;else S.cart.push({id,spec,qty:1});S.modal=null;render();toast('已加入选品单（'+spec+'）');return}
 if(a==='add-package'){const c=S.cart.find(x=>x.id===id&&x.type==='package');if(c)c.qty++;else S.cart.push({id,type:'package',spec:'套餐',qty:1});S.modal=null;render();toast('套餐已加入选品单');return}
 if(a==='qty'){const c=S.cart.find(x=>x.id===id&&x.spec===el.dataset.spec);if(!c)return;c.qty+=Number(el.dataset.d);if(c.qty<=0)S.cart=S.cart.filter(x=>x!==c);render();return}
 if(a==='submit'){
  if(!S.cart.length){toast('选品单是空的');return}
  if(!S.form.who||!S.form.tel){toast('请填姓名和电话');return}
  const no='NO'+Date.now(),items=S.cart.map(c=>{const x=cartItem(c);return{name:x.name,spec:c.spec,qty:c.qty,price:x.price}});
  S.orders.unshift({no,who:S.form.who,tel:S.form.tel,note:S.form.note||'（未填）',status:'已提交',date:'2026-11-12 刚刚',mine:1,items});
  S.profile.who=S.form.who;S.profile.tel=S.form.tel;S.form.note='';S.cart=[];S.page='orders';
  logEvent('新订单提交','商户后台 · 待确认列表');render();return
 }
 if(a==='confirm-order'){const o=S.orders.find(x=>x.no===no);o.status='已确认';logEvent('订单确认备货','客户 '+o.who+'（自行查看）');render();return}
 if(a==='export'){toast('导出功能演示占位');return}
 if(a==='admin-tab'){S.adminTab=el.dataset.tab;render();return}
 if(a==='pick-product'){toggleDraftProduct(id);renderModal();return}
 if(a==='new-package'){S._pkgDraft=null;S.modal={type:'pkgEdit',id:null};renderModal();return}
 if(a==='edit-package'){S._pkgDraft=null;S.modal={type:'pkgEdit',id};renderModal();return}
 if(a==='save-package'){if(!S._pkgDraft){toast('请先打开套餐编辑');return}if(!String(S._pkgDraft.name||'').trim()){toast('请填套餐名称');return}savePackage(S._pkgDraft);render();toast('套餐已保存');return}
 if(a==='delete-package'){deletePackage(id);render();toast('套餐已删除');return}
 if(a==='toggle-package'){togglePackage(id);render();toast('上架状态已更新');return}
 if(a==='toggle-product'){const x=S.products.find(y=>y.id===id);x.on=x.on?0:1;render();return}
});
function onField(e){
 const f=e.target.dataset.field;if(!f)return;
 if(f==='who'||f==='tel'||f==='note'){S.form[f]=e.target.value;return}
 if(f==='slogan'){S.slogan=e.target.value;return}
 if(f==='price'){const x=S.products.find(y=>y.id===e.target.dataset.id);if(x)x.price=Number(e.target.value)||0;return}
 if(f==='filterStatus'){S.filterStatus=e.target.value;render();return}
 if(f==='pkgName'||f==='pkgDesc'||f==='pkgPrice'){if(S._pkgDraft)S._pkgDraft[{pkgName:'name',pkgDesc:'desc',pkgPrice:'price'}[f]]=e.target.value;return}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
S.form.who=S.profile.who;S.form.tel=S.profile.tel;render();
</script>
</body>
</html>
