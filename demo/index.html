<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>SparkCart 烟花小程序 · 三角色演示原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 18% 0%,#2b1836,#0c0a12 62%);color:#f5f2ea;min-height:100vh;padding:20px 12px 34px}
.stage{max-width:470px;margin:0 auto;text-align:center}
.h1{font-size:19px;font-weight:700;letter-spacing:1px}
.h1 small{display:block;font-size:11px;font-weight:400;color:#a69db8;margin-top:5px;letter-spacing:0}
.roles{display:flex;gap:7px;background:#1b1726;padding:6px;border-radius:14px;margin:14px auto 10px;border:1px solid #322b45}
.roles button{flex:1;border:0;background:transparent;color:#a69db8;padding:10px 2px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600}
.roles button.on{background:linear-gradient(135deg,#e64340,#a9222b);color:#fff;box-shadow:0 4px 14px rgba(230,67,64,.35)}
.flow{font-size:10px;color:#9a92ac;line-height:1.7;background:#191424;border:1px solid #2c2540;border-radius:10px;padding:8px 10px;margin-bottom:12px;text-align:left}
.flow b{color:#f0b64b}
.phone{width:390px;max-width:100%;height:770px;background:#14111d;border:9px solid #2a2438;border-radius:38px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.6);position:relative}
.topbar{height:64px;background:linear-gradient(135deg,#1e1829,#271a2d);display:flex;align-items:center;justify-content:space-between;padding:13px 16px 9px;border-bottom:1px solid #2f2740;flex-shrink:0}
.topbar .t{font-size:15px;font-weight:700}
.topbar .s{font-size:11px;color:#f0b64b;margin-top:2px}
.demo-tag{font-size:10px;color:#241a0d;background:#f0b64b;padding:3px 8px;border-radius:20px;font-weight:700}
.screen{flex:1;overflow-y:auto;padding:14px 14px 22px;text-align:left;scrollbar-width:thin}
.screen::-webkit-scrollbar{width:4px}
.screen::-webkit-scrollbar-thumb{background:#3a3150;border-radius:4px}
.tabbar{height:62px;background:#1b1626;border-top:1px solid #2f2740;display:flex;flex-shrink:0}
.tabbar button{flex:1;border:0;background:transparent;color:#8d86a0;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tabbar button span{font-size:17px;line-height:1}
.tabbar button.on{color:#f0b64b}
.hero{border-radius:16px;padding:17px;background:linear-gradient(135deg,#8e1f26,#c33a2c 55%,#e08b32);position:relative;overflow:hidden;margin-bottom:13px}
.hero:after{content:"✦";position:absolute;right:-6px;top:-26px;font-size:112px;color:rgba(255,255,255,.09)}
.hero h2{font-size:17px;line-height:1.45;letter-spacing:.5px}
.hero p{font-size:10px;opacity:.85;margin-top:7px}
.card{background:#211c2e;border:1px solid #322b45;border-radius:14px;padding:13px;margin-bottom:11px}
.card.flat{padding:11px}
.sec{font-size:14px;font-weight:700;margin:15px 0 9px;display:flex;justify-content:space-between;align-items:center}
.sec small{font-size:10px;color:#8d86a0;font-weight:400}
.muted{color:#9a92ac;font-size:11px;line-height:1.65}
.gold{color:#f0b64b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.thumb{height:92px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:38px}
.thumb i{position:absolute;left:6px;bottom:5px;font-style:normal;font-size:10px;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:5px;color:#fff}
.pname{font-size:12px;font-weight:600;margin:7px 0 3px;line-height:1.35}
.pcode{font-size:10px;color:#9a92ac}
.btn{border:0;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#e64340,#b3252a);color:#fff;width:100%}
.btn.ghost{background:#2c2540;color:#e9e3f2;border:1px solid #3d3456}
.btn.gold{background:linear-gradient(135deg,#f0b64b,#d08b25);color:#241a0d}
.btn.mini{width:auto;padding:6px 10px;font-size:11px;border-radius:8px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:11px;padding-bottom:2px}
.chip{flex-shrink:0;font-size:11px;padding:6px 12px;border-radius:20px;background:#2a2339;color:#a69db8;border:1px solid #3a3150;cursor:pointer}
.chip.on{background:#f0b64b;color:#241a0d;border-color:#f0b64b;font-weight:700}
.row{display:flex;align-items:center;gap:9px}
.row.between{justify-content:space-between}
.tag{font-size:10px;padding:3px 8px;border-radius:6px;background:#332a48;color:#c9bfe0;white-space:nowrap}
.tag.a{background:#5a3a1a;color:#ffcf7a}
.tag.b{background:#1d4a3a;color:#7fe0b0}
.tag.c{background:#2a3d63;color:#9ec5ff}
.tag.d{background:#4a2530;color:#ff9aa0}
.tag.e{background:#4a3a1e;color:#ffd98a}
.stat{display:flex;gap:8px;margin-bottom:11px}
.stat div{flex:1;background:#211c2e;border:1px solid #322b45;border-radius:12px;padding:11px 6px;text-align:center}
.stat b{display:block;font-size:17px;color:#f0b64b;margin-bottom:3px}
.stat span{font-size:10px;color:#9a92ac}
.item{background:#211c2e;border:1px solid #322b45;border-radius:12px;padding:11px;margin-bottom:9px}
.item .ttl{font-size:13px;font-weight:600;margin-bottom:4px}
.item .sub{font-size:10px;color:#9a92ac;line-height:1.65}
.qty{display:flex;align-items:center;gap:7px}
.qty button{width:23px;height:23px;border:0;border-radius:7px;background:#332a48;color:#fff;font-size:14px;cursor:pointer}
.qty span{font-size:12px;min-width:14px;text-align:center}
.cb{width:20px;height:20px;border-radius:6px;border:1px solid #5a4d76;background:#191424;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:#241a0d}
.cb.on{background:#f0b64b;border-color:#f0b64b;font-weight:700}
label.f{display:block;font-size:11px;color:#a69db8;margin:10px 0 5px}
input.f,select.f,textarea.f{width:100%;background:#171320;border:1px solid #3a3150;border-radius:9px;padding:10px;color:#f5f2ea;font-size:12px;outline:none;font-family:inherit}
textarea.f{resize:none;height:64px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:#f0b64b}
.qr{width:126px;height:126px;background:#fff;border-radius:10px;padding:7px;margin:9px auto}
.qr svg{width:100%;height:100%;fill:#171320}
.notice{font-size:10px;color:#8d86a0;line-height:1.7;background:#1a1624;border-left:2px solid #f0b64b;padding:8px 10px;border-radius:0 8px 8px 0;margin-top:9px}
.timeline{border-left:2px solid #3a3150;margin:8px 0 0 6px;padding-left:12px}
.timeline div{font-size:10px;color:#a69db8;margin-bottom:8px;position:relative}
.timeline div:before{content:"";position:absolute;left:-17px;top:4px;width:7px;height:7px;border-radius:50%;background:#f0b64b}
.stabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:11px}
.stab{flex-shrink:0;font-size:10px;padding:6px 10px;border-radius:8px;background:#241e33;color:#a69db8;border:1px solid #362e4a;cursor:pointer}
.stab.on{background:#3a2f52;color:#f0b64b;border-color:#6a568f}
.mbg{position:absolute;inset:0;background:rgba(6,4,10,.78);display:flex;align-items:flex-end;z-index:9}
.modal{width:100%;background:#211c2e;border-radius:20px 20px 0 0;padding:17px 15px 22px;max-height:80%;overflow-y:auto;border-top:1px solid #403654}
.modal h3{font-size:15px;margin-bottom:10px}
.close{float:right;font-size:12px;color:#9a92ac;cursor:pointer;padding:2px 6px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(0,0,0,.9);border:1px solid #4a3f66;color:#fff;font-size:11px;padding:9px 15px;border-radius:20px;z-index:20;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.foot{font-size:10px;color:#8d86a0;margin-top:12px;line-height:1.8}
.empty{text-align:center;color:#8d86a0;font-size:12px;padding:34px 0}
.pill{display:inline-block;font-size:9px;padding:2px 7px;border-radius:5px;background:#332a48;color:#c9bfe0;margin-left:5px}
</style>
</head>
<body>
<div class="stage">
  <div class="h1">SparkCart · 烟花小程序演示原型<small>客户 / 代理 / 运营方 三套页面 · 测试数据 · 全程不支付不结算</small></div>
  <div class="roles">
    <button data-act="role" data-role="customer">客户端</button>
    <button data-act="role" data-role="agent">代理端</button>
    <button data-act="role" data-role="admin">运营方端</button>

  <div class="flow"><b>演示主线：</b>先看客户端产品画册（首页 / 视频 / 产品 / 套餐，项目主角），再走留资闭环：① 加购提交订单 ② 运营方后台确定备货 ③ 代理勾选组账期 ④ 运营方确认结算。<b>按无资质：不线上付款、不做公众号推送</b></div>
  <div class="phone">
    <div class="topbar"><div><div class="t" id="rTitle">客户端</div><div class="s" id="rSub">长春宏伟烟花</div></div><div class="demo-tag">演示数据</div></div>
    <div class="screen" id="screen"></div>
    <div class="tabbar" id="tabbar"></div>
    <div class="toast" id="toast"></div>
    <div id="modalHost"></div>
  </div>
  <div class="foot">线上产品画册 · 单文件离线可开 · 数据刷新重置 · 按无烟花类目资质与无认证服务号处理：不线上收款、不做自动推送 · 客户端全程不出现金额</div>
</div>

];

 {no:'S20261108001',agent:'A02',orders:['NO20261107006'],amount:238,status:'已结算',date:'2026-11-08'}
];
const TABS={
 customer:[{k:'home',n:'首页',i:'🏠'},{k:'goods',n:'产品',i:'🎆'},{k:'cart',n:'购物车',i:'🛒'},{k:'orders',n:'订单',i:'📋'},{k:'my',n:'我的',i:'👤'}],
 agent:[{k:'dash',n:'工作台',i:'📊'},{k:'orders',n:'订单',i:'📋'},{k:'settle',n:'结算',i:'💰'},{k:'customers',n:'客户',i:'👥'},{k:'promo',n:'推广',i:'📲'}],
 admin:[{k:'overview',n:'概览',i:'📊'},{k:'orders',n:'订单',i:'📋'},{k:'settle',n:'结算',i:'💰'},{k:'products',n:'商品',i:'🎇'},{k:'manage',n:'管理',i:'⚙️'}]
};
const ROLE={customer:['客户端','长春宏伟烟花'],agent:['代理端','李宏伟 · A01'],admin:['运营方端','总店 · 管理员']};
const S={role:'customer',page:'home',cat:'全部',filterAgent:'全部',adminTab:'agents',cart:[],selected:new Set(),modal:null,
 slogan:'长春宏伟烟花 · 正规货源 · 一站配齐',
 profile:{who:'王老板',tel:'13800001111'},

const amt=o=>o.items.reduce((s,i)=>s+i.price*i.qty,0);
const money=n=>'¥'+Number(n).toFixed(0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function qr(seed){let s=seed,c='';const r=()=>{s=(s*9301+49297)%233280;return s/233280};for(let y=0;y<21;y++)for(let x=0;x<21;x++){const k=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on;if(k){const a=x>13?x-14:x,b=y>13?y-14:y;on=(a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4))}else on=r()>.52;if(on)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">${c}</svg>`}
function thumb(p){return `<div class="thumb" style="background:${p.bg}"><span>${p.emoji}</span><i>编号 ${p.code}</i></div>`}

function note_(txt){return `<div class="notice">${txt}</div>`}
function orderCard(o,showMoney,selectable){
 const cb=selectable?`<div class="cb ${S.selected.has(o.no)?'on':''}" data-act="select" data-no="${o.no}">${S.selected.has(o.no)?'✓':''}</div>`:'';
 const inner=`<div style="flex:1;min-width:0" data-act="order" data-no="${o.no}"><div class="row between"><span class="ttl">${o.who} <span style="font-size:10px;color:#9a92ac">${o.tel}</span></span>${stTag(o.status)}</div><div class="sub">${o.no} · ${o.date}</div><div class="sub">${o.items.map(i=>i.name+'（'+i.spec+'）×'+i.qty).join('、')}</div><div class="row between" style="margin-top:6px"><span class="sub">备注：${esc(o.note)||'无'}${showMoney?' · 代理 '+o.agent+' · '+seTag(o.settle):''}</span>${showMoney?`<b class="gold" style="font-size:12px">${money(amt(o))}</b>`:''}</div></div>`;
 return `<div class="item row">${cb}${inner}</div>`;
}

function renderAgent(){

 if(m.type==='order'){const o=S.orders.find(x=>x.no===m.no);b=`<h3>订单详情<span class="close" data-act="close">关闭</span></h3><div class="item"><div class="row between"><span class="ttl">${o.who}</span>${stTag(o.status)}</div><div class="sub">${o.no}<br>${o.date}<br>${o.tel}<br>代理 ${o.agent} · ${seTag(o.settle)}<br>备注：${esc(o.note)||'无'}</div></div><div class="card">${o.items.map(i=>`<div class="row between" style="margin-bottom:6px"><span style="font-size:12px">${i.name}（${i.spec}）× ${i.qty}</span>${S.role==='customer'?'':`<span class="muted">${money(i.price*i.qty)}</span>`}</div>`).join('')}${S.role==='customer'?'':`<div class="row between" style="border-top:1px solid #3a3150;padding-top:8px"><b style="font-size:12px">合计（后台）</b><b class="gold">${money(amt(o))}</b></div>`}</div><div class="sec" style="margin:10px 0 6px">状态流转</div><div class="timeline"><div>${o.date}　订单已提交</div>${o.status!=='已提交'?`<div>运营方已确定，开始备货</div>`:''}${o.status==='已完成'?`<div>订单已完成</div>`:''}${o.status==='已取消'?`<div>订单已取消</div>`:''}</div>${note_('只登记订单，不支付、不结算。')}`}
 if(m.type==='video')b=`<h3>烟花效果视频<span class="close" data-act="close">关闭</span></h3><div class="card" style="text-align:center;padding:32px 14px"><div style="font-size:44px">🎆</div><div class="muted" style="margin-top:9px">演示占位：正式版播放商户提供的实拍视频，文件放云存储</div></div><button class="btn ghost" data-act="close">知道了</button>`;
 if(m.type==='addAgent')b=`<h3>添加代理<span class="close" data-act="close">关闭</span></h3><div class="card"><label class="f">姓名</label><input class="f" data-field="newName" placeholder="代理姓名"><label class="f">电话</label><input class="f" data-field="newTel" placeholder="手机号"></div><button class="btn" data-act="save-agent">保存</button>`;
 if(m.type==='agentOrders'){const a=S.agents.find(x=>x.id===m.id),list=S.orders.filter(o=>o.agent===m.id);b=`<h3>${esc(a.name)} 的订单<span class="close" data-act="close">关闭</span></h3>${list.map(o=>orderCard(o,true,false)).join('')||'<div class="empty">暂无订单</div>'}<button class="btn ghost" data-act="close">返回</button>`}
 if(m.type==='settleDetail'){const s=S.settlements.find(x=>x.no===m.no);b=`<h3>结算单 ${s.no}<span class="close" data-act="close">关闭</span></h3><div class="item"><div class="row between"><span class="ttl">代理 ${s.agent}</span><span class="tag ${s.status==='已结算'?'b':'a'}">${s.status}</span></div><div class="sub">${s.date} · 含 ${s.orders.length} 单</div></div>${s.orders.map(n=>{const o=S.orders.find(x=>x.no===n);return o?`<div class="row between" style="font-size:11px;margin-bottom:7px"><span class="muted">${n}　${o.who}</span><span>${money(amt(o))}</span></div>`:''}).join('')}<div class="card"><div class="row between"><b style="font-size:12px">结算金额</b><b class="gold">${money(s.amount)}</b></div></div><button class="btn ghost" data-act="close">返回</button>`}
 if(m.type==='bind')b=`<h3>新订单提醒<span class="close" data-act="close">关闭</span></h3><div class="card"><div class="muted">按没有认证服务号处理：不做公众号绑定与模板消息推送。代理 / 运营方登录后台查看「待确认」订单，客户提交后自行查看状态，双方线下微信 / 电话沟通。</div></div><button class="btn ghost" data-act="close">知道了</button>`;
 host.innerHTML=`<div class="mbg" data-act="close-bg"><div class="modal">${b}</div></div>`;
}
function render(){
 const r=S.role,c=TABS[r];
 document.getElementById('rTitle').textContent=ROLE[r][0];
 document.getElementById('rSub').textContent=ROLE[r][1];
 document.querySelectorAll('.roles button').forEach(b=>b.classList.toggle('on',b.dataset.role===r));
 document.getElementById('tabbar').innerHTML=c.map(t=>`<button data-act="nav" data-page="${t.k}" class="${S.page===t.k||(r==='customer'&&S.page==='checkout'&&t.k==='cart')?'on':''}"><span>${t.i}</span>${t.n}</button>`).join('');
 const key=r+'/'+S.page,keep=S._key===key,s=document.getElementById('screen'),y=s.scrollTop;
 s.innerHTML=({customer:renderCustomer,agent:renderAgent,admin:renderAdmin})[r]();
 s.scrollTop=keep?y:0;S._key=key;renderModal();
}
function openCheckout(){S.form.who=S.profile.who;S.form.tel=S.profile.tel;S.form.note='';S.page='checkout';render()}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,no=el.dataset.no;
 if(a==='close-bg'&&e.target!==el)return;
 if(a==='role'){S.role=el.dataset.role;S.page=TABS[S.role][0].k;S.modal=null;S.selected.clear();render();return}
 if(a==='nav'){S.page=el.dataset.page;S.modal=null;render();return}
 if(a==='cat'){S.cat=el.dataset.cat;S.page=S.role==='customer'?'goods':S.page;render();return}
 if(a==='product'){S.modal={type:'product',id};renderModal();return}
 if(a==='order'){S.modal={type:'order',no};renderModal();return}
 if(a==='video'){S.modal={type:'video'};renderModal();return}
 if(a==='close'||a==='close-bg'){S.modal=null;renderModal();return}
 if(a==='add'){const spec=el.dataset.spec||'单件',c=S.cart.find(x=>x.id===id&&x.spec===spec);if(c)c.qty++;else S.cart.push({id,spec,qty:1});S.modal=null;render();toast('已加入购物车（'+spec+'）');return}
 if(a==='qty'){const c=S.cart.find(x=>x.id===id&&x.spec===el.dataset.spec);if(!c)return;c.qty+=Number(el.dataset.d);if(c.qty<=0)S.cart=S.cart.filter(x=>x!==c);render();return}
 if(a==='sub'){S.form.sub=S.form.sub?0:1;render();return}
 if(a==='submit'){
  if(!S.cart.length){toast('购物车是空的');return}
  if(!S.form.who||!S.form.tel){toast('请填姓名和电话');return}
  const no='NO'+Date.now();
  const items=S.cart.map(c=>{const x=S.products.find(y=>y.id===c.id);return{name:x.name,spec:c.spec,qty:c.qty,price:x.price}});
  S.orders.unshift({no,agent:'A01',who:S.form.who,tel:S.form.tel,note:S.form.note||'（未填）',status:'已提交',settle:'未出账',date:'2026-11-12 刚刚',mine:1,items});
  S.profile.who=S.form.who;S.profile.tel=S.form.tel;S.cart=[];S.page='orders';render();
  pushNotify('新订单提交','代理 李宏伟 + 运营方','后台站内留痕');return
 }
 if(a==='select'){const o=S.orders.find(x=>x.no===no);if(o.settle!=='未出账'||o.status==='已取消'){toast('该订单不能组账期');return}if(S.selected.has(no))S.selected.delete(no);else S.selected.add(no);render();return}
 if(a==='create-settle'){
  const list=[...S.selected];if(!list.length){toast('请先勾选订单');return}
  const sd='S'+Date.now(),amount=list.reduce((s,n)=>s+amt(S.orders.find(o=>o.no===n)),0);
  S.settlements.unshift({no:sd,agent:'A01',orders:list,amount,status:'待结算',date:'2026-11-12'});
  list.forEach(n=>S.orders.find(o=>o.no===n).settle='已出账');S.selected.clear();S.page='settle';render();
  pushNotify('结算单提交','运营方','后台站内留痕');return
 }
 if(a==='settle-detail'){S.modal={type:'settleDetail',no};renderModal();return}
 if(a==='confirm-settle'){const s=S.settlements.find(x=>x.no===no);s.status='已结算';s.orders.forEach(n=>S.orders.find(o=>o.no===n).settle='已结算');S.modal=null;render();pushNotify('结算单确认','代理 李宏伟','后台站内留痕');return}
 if(a==='confirm-order'){const o=S.orders.find(x=>x.no===no);o.status='已确认';render();pushNotify('订单确认备货','客户 '+o.who,'二期可选：订阅消息');return}
 if(a==='copy'){toast('分享链接已复制（演示）');return}
 if(a==='export'){toast('导出功能演示占位');return}
 if(a==='bind'){S.modal={type:'bind'};renderModal();return}
 if(a==='admin-tab'){S.adminTab=el.dataset.tab;render();return}
 if(a==='add-agent'){S.modal={type:'addAgent'};renderModal();return}
 if(a==='save-agent'){const n=S._newName||'';if(!n){toast('请填姓名');return}const nid='A'+String(S.agents.length).padStart(2,'0');S.agents.push({id:nid,name:n,tel:S._newTel||'未填',on:1,wx:'未绑定'});S._newName='';S._newTel='';S.modal=null;render();toast('已添加代理 '+nid);return}
 if(a==='toggle-agent'){const x=S.agents.find(y=>y.id===id);x.on=x.on?0:1;render();return}
 if(a==='agent-orders'){S.modal={type:'agentOrders',id};renderModal();return}
 if(a==='toggle-product'){const x=S.products.find(y=>y.id===id);x.on=x.on?0:1;render();return}
});
document.addEventListener('input',e=>{
 const f=e.target.dataset.field;if(!f)return;
 if(f==='who'||f==='tel'||f==='note'){S.form[f]=e.target.value;return}
 if(f==='slogan'){S.slogan=e.target.value;return}
 if(f==='price'){const x=S.products.find(y=>y.id===e.target.dataset.id);if(x)x.price=Number(e.target.value)||0;return}
 if(f==='filterAgent'){S.filterAgent=e.target.value;render();return}
 if(f==='newName'){S._newName=e.target.value;return}
 if(f==='newTel'){S._newTel=e.target.value;return}
});
S.form.who=S.profile.who;S.form.tel=S.profile.tel;render();
</script>
</body>
</html>
