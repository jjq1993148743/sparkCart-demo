 for(let i=0;i<N;i++){
  const a=Math.PI*2*i/N,len=25+rnd()*17;

  lines+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width=".8" opacity="${(.35+rnd()*.6).toFixed(2)}"/>`;
  if(rnd()>.42)dots+=`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="${(.7+rnd()*.9).toFixed(1)}" fill="${c}" opacity=".9"/>`;
 }
 return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="50" cy="50" r="3.4" fill="${c}"/><circle cx="50" cy="50" r="11" fill="none" stroke="${c}" stroke-width=".5" opacity=".45"/>${lines}${dots}</svg>`;
}

function render(){
 const r=S.role,c=TABS[r];
 document.getElementById('rTitle').textContent=pageTitle();
 document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.role===r));
 document.getElementById('tabbar').innerHTML=c.map(t=>`<button data-act="nav" data-page="${t.k}" class="${S.page===t.k||(r==='customer'&&['cart','checkout'].includes(S.page)&&t.k==='home')?'on':''}">${icon(t.i)}${t.n}</button>`).join('');
 const fab=document.getElementById('cartFab'),n=S.cart.reduce((s,x)=>s+x.qty,0);
 fab.style.display=r==='customer'?'flex':'none';
 fab.innerHTML=icon('bag')+(n?`<span class="badge">${n}</span>`:'');
 const key=r+'/'+S.page,keep=S._key===key,s=document.getElementById('screen'),y=s.scrollTop;

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,no=el.dataset.no;
 if(a==='close-bg'&&e.target!==el)return;
 if(a==='role'){S.role=el.dataset.role;S.page=TABS[S.role][0].k;S.modal=null;render();return}
 if(a==='nav'){S.page=el.dataset.page;S.modal=null;render();return}
 if(a==='show-all'){S.seriesId='ALL';S.page='goods';S.modal=null;render();return}
 if(a==='series-view'){S.seriesId=el.dataset.id;S.page='goods';S.modal=null;render();return}
 if(a==='manage-series'){S.role='merchant';S.page='manage';S.adminTab='series';render();return}
 if(a==='status-filter'){S.filterStatus=el.dataset.v;render();return}
 if(a==='product'){S.modal={type:'product',id};renderModal();return}
 if(a==='package'){S.modal={type:'package',id};renderModal();return}
 if(a==='order'){S.modal={type:'order',no};renderModal();return}
 if(a==='video'){S.modal={type:'video'};renderModal();return}
 if(a==='close'||a==='close-bg'){S.modal=null;renderModal();return}
 if(a==='add'){const spec=el.dataset.spec||'单件',c=S.cart.find(x=>x.id===id&&x.spec===spec);if(c)c.qty++;else S.cart.push({id,spec,qty:1});S.modal=null;render();toast('已加入购物车（'+spec+'）');return}
 if(a==='add-package'){const c=S.cart.find(x=>x.id===id&&x.type==='package');if(c)c.qty++;else S.cart.push({id,type:'package',spec:'套餐',qty:1});S.modal=null;render();toast('套餐已加入购物车');return}
 if(a==='qty'){const c=S.cart.find(x=>x.id===id&&x.spec===el.dataset.spec);if(!c)return;c.qty+=Number(el.dataset.d);if(c.qty<=0)S.cart=S.cart.filter(x=>x!==c);render();return}
 if(a==='submit'){
  if(!S.cart.length){toast('购物车是空的');return}
  if(!S.form.who||!S.form.tel){toast('请填姓名和电话');return}
  submitOrder();S.page='orders';render();toast('订单已提交');return
 }
 if(a==='confirm-order'){confirmOrder(no);render();toast('订单已确认，开始备货');return}
 if(a==='admin-tab'){S.adminTab=el.dataset.tab;render();return}
 if(a==='toggle-product'){const x=S.products.find(y=>y.id===id);x.on=x.on?0:1;render();return}
 if(a==='new-series'){S._sd=null;S.modal={type:'seriesEdit',id:null};renderModal();return}
 if(a==='edit-series'){S._sd=null;S.modal={type:'seriesEdit',id};renderModal();return}
 if(a==='pick-icon'){if(S._sd)S._sd.icon=el.dataset.icon;renderModal();return}
 if(a==='toggle-series-on'){if(S._sd)S._sd.on=S._sd.on?0:1;renderModal();return}
 if(a==='save-series'){if(!S._sd){toast('请先打开系列编辑');return}if(!String(S._sd.name||'').trim()){toast('请填系列名称');return}saveSeries(S._sd);render();toast('系列已保存');return}
 if(a==='delete-series'){deleteSeries(id);render();toast('系列已删除');return}
 if(a==='toggle-series'){toggleSeries(id);render();toast('系列状态已更新');return}
 if(a==='new-package'){S._pkgDraft=null;S.modal={type:'pkgEdit',id:null};renderModal();return}
 if(a==='edit-package'){S._pkgDraft=null;S.modal={type:'pkgEdit',id};renderModal();return}
 if(a==='pick-product'){toggleDraftProduct(id);renderModal();return}
 if(a==='save-package'){if(!S._pkgDraft){toast('请先打开套餐编辑');return}if(!String(S._pkgDraft.name||'').trim()){toast('请填套餐名称');return}savePackage(S._pkgDraft);render();toast('套餐已保存');return}
 if(a==='delete-package'){deletePackage(id);render();toast('套餐已删除');return}
 if(a==='toggle-package'){togglePackage(id);render();toast('上架状态已更新');return}
});
function onField(e){
 const f=e.target.dataset.field;if(!f)return;
 if(f==='who'||f==='tel'||f==='note'){S.form[f]=e.target.value;return}
 if(f==='slogan'){S.slogan=e.target.value;return}
 if(f==='price'){const x=S.products.find(y=>y.id===e.target.dataset.id);if(x)x.price=Number(e.target.value)||0;return}
 if(f==='productSeries'){setProductSeries(e.target.dataset.id,e.target.value);render();return}
 if(f==='seriesName'){if(S._sd)S._sd.name=e.target.value;return}
 if(f==='seriesSort'){if(S._sd)S._sd.sort=Number(e.target.value)||0;return}
 if(f==='pkgName'||f==='pkgDesc'||f==='pkgPrice'){if(S._pkgDraft)S._pkgDraft[{pkgName:'name',pkgDesc:'desc',pkgPrice:'price'}[f]]=e.target.value;return}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
S.form.who=S.profile.who;S.form.tel=S.profile.tel;render();
</script>
</body>
</html>
